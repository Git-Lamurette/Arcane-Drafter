name: Feature request
description: Suggest an idea or improvement for Arcane-Drafter.
title: "[Feature]: "
labels: ["feature", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a feature. Concrete, well-scoped requests are easiest to act on.

        For open-ended ideas or "wouldn't it be cool if…" discussions, please use [Discussions](https://github.com/Git-Lamurette/Arcane-Drafter/discussions) instead.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the player experience or pain point this would address.
      placeholder: "When I'm drafting late-game, I struggle to..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe what you'd like to see happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why they fall short.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Mockups, references to other games, related issues, etc.
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: I have searched existing issues and discussions and this is not a duplicate.
          required: true
        - label: I agree to follow this project's Code of Conduct.
          required: true
