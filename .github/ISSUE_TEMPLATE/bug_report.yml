name: Bug report
description: Report something that's broken or behaving unexpectedly in Arcane-Drafter.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill out the fields below so the issue can be reproduced and triaged quickly.

        Before submitting, please [search existing issues](https://github.com/Git-Lamurette/Arcane-Drafter/issues?q=is%3Aissue) to avoid duplicates.

  - type: input
    id: version
    attributes:
      label: Game version
      description: Which version of Arcane-Drafter are you running? (Visible on the title screen or in the launcher.)
      placeholder: "e.g. 0.3.1"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Linux
        - Other (please specify in additional context)
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: "e.g. Windows 11 23H2, macOS 14.4, Ubuntu 24.04"
    validations:
      required: false

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear, concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal, ordered steps that reliably trigger the bug.
      placeholder: |
        1. Start a new run with...
        2. Draft the card...
        3. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots, or save files
      description: |
        Attach anything that helps diagnose the issue. Drag files into the box to upload.
        Logs are typically located at:
        - Windows: `%APPDATA%\Arcane-Drafter\logs`
        - macOS: `~/Library/Application Support/Arcane-Drafter/logs`
        - Linux: `~/.local/share/Arcane-Drafter/logs`
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that might be relevant — mods, hardware, recent changes, etc.
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: I agree to follow this project's Code of Conduct.
          required: true
